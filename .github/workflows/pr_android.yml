name: Pull Requests build

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode signing certificates
      run: |
        echo "${{ secrets.SIGNING_PK8 }}" | base64 -d > app/mixin/testkey.pk8
        echo "${{ secrets.SIGNING_CERT_PEM }}" | base64 -d > app/mixin/testkey.x509.pem
        echo "Certificates decoded successfully"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew MixinApk-release
