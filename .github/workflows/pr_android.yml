name: Pull Requests build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Decode signing certificates
        run: |
          mkdir -p app/mixin
          echo "$SIGNING_PK8_B64" | base64 -d > app/mixin/testkey.pk8
          echo "$SIGNING_CERT_B64" | base64 -d > app/mixin/testkey.x509.pem
          ls -la app/mixin/testkey.*
        env:
          SIGNING_PK8_B64: ${{ secrets.SIGNING_PK8 }}
          SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_PEM }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew MixinApk-release
