name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Decode signing certificates
        env:
          SIGNING_PK8: ${{ secrets.SIGNING_PK8 }}
          SIGNING_CERT_PEM: ${{ secrets.SIGNING_CERT_PEM }}
        run: |
          mkdir -p app/mixin
          printf '%s' "$SIGNING_PK8" | base64 -d > app/mixin/testkey.pk8
          printf '%s' "$SIGNING_CERT_PEM" | base64 -d > app/mixin/testkey.x509.pem
          ls -la app/mixin/testkey.*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew MixinApk-release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQPro
          path: app/dist/QQPro*.apk
